name: E2E

# Manual for now, as #40 asks: the journey needs a Supabase stack and a browser,
# which is minutes rather than seconds. Move it onto `pull_request` once it has
# proved itself stable here.
on:
  workflow_dispatch:

jobs:
  journey:
    name: signup → route → request → confirm → status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run the journey against a local Supabase
        run: bash scripts/test-e2e.sh

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
